<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Indian History — Visual Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ultra-clean museum background: deep void with zero distractions */
    .gallery-stage {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #08080a 0%, #000000 85%);
      pointer-events: none;
      z-index: 0;
    }

    /* Horizontal Exhibition Corridor: strictly pictures and titles */
    .corridor {
      position: relative;
      z-index: 5;
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
      padding: 0 16vw;
      gap: clamp(5.5rem, 9.5vw, 11.5rem);
      scroll-behavior: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      touch-action: pan-x;
    }

    .corridor.is-dragging {
      cursor: grabbing;
    }

    .corridor::-webkit-scrollbar {
      display: none;
    }

    /* Individual Exhibit Item */
    .exhibit-item {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition:
        opacity 0.55s cubic-bezier(0.2, 0.9, 0.3, 1),
        transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1),
        filter 0.55s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Cinema Focus Physics: hovering one dims all others to 25% */
    .corridor.cinema-active .exhibit-item:not(.is-focused) {
      opacity: 0.25;
      filter: grayscale(40%) brightness(0.65);
      transform: scale(0.97);
    }

    .corridor.cinema-active .exhibit-item.is-focused {
      opacity: 1;
      filter: brightness(1.04);
      transform: scale(1.02);
    }

    /* Pure Museum Canvas */
    .canvas-wrap {
      position: relative;
      height: clamp(280px, 56vh, 520px);
      aspect-ratio: 4 / 3;
      border-radius: 4px;
      overflow: hidden;
      background: #0a0a0c;
      box-shadow:
        0 20px 50px -10px rgba(0, 0, 0, 0.95),
        0 8px 20px -4px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: box-shadow 0.5s ease;
    }

    .canvas-wrap.aspect-wide {
      aspect-ratio: 16 / 10;
    }

    .canvas-wrap.aspect-tall {
      aspect-ratio: 3 / 4;
      height: clamp(300px, 60vh, 560px);
    }

    .canvas-wrap.aspect-classic {
      aspect-ratio: 4 / 3;
    }

    .exhibit-item.is-focused .canvas-wrap {
      box-shadow:
        0 30px 70px -10px rgba(0, 0, 0, 1),
        0 0 38px rgba(214, 178, 109, 0.2),
        0 0 0 1px rgba(214, 178, 109, 0.42);
    }

    .canvas-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.03) saturate(1.02);
      transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .exhibit-item.is-focused .canvas-image {
      transform: scale(1.025);
    }

    /* Minimal Floating Typewriter Title & Year */
    .exhibit-label {
      margin-top: 22px;
      text-align: center;
      width: clamp(280px, 34vw, 460px);
      min-height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      pointer-events: none;
    }

    .year-stamp {
      font-family: 'JetBrains Mono', 'Cinzel', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #d6b26d;
      min-height: 1.2em;
    }

    .title-stamp {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1rem, 1.3vw, 1.22rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.015em;
      color: #ede6d6;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      min-height: 2.7em;
    }

    /* Subtle Typewriter Caret */
    .tw-cursor::after {
      content: "▍";
      display: inline-block;
      margin-left: 3px;
      color: #d6b26d;
      font-size: 0.85em;
      animation: caretBlink 0.65s infinite;
    }

    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Pure Floor Reflection */
    .floor-reflection {
      position: relative;
      margin-top: 8px;
      width: 100%;
      height: 68px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.17;
      filter: blur(2.2px);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.78) 0%, transparent 90%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.78) 0%, transparent 90%);
      transition: opacity 0.5s ease;
    }

    .exhibit-item.is-focused .floor-reflection {
      opacity: 0.3;
    }

    .reflection-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: bottom center;
      transform: scaleY(-1);
      display: block;
    }

    /* Minimal Progress Hairline at Bottom */
    .corridor-bar-track {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 20;
      pointer-events: none;
    }

    .corridor-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b85d3b, #d6b26d);
      box-shadow: 0 0 10px rgba(214, 178, 109, 0.6);
      transition: width 0.1s ease-out;
    }
  </style>
</head>
<body>
  <div class="gallery-stage" aria-hidden="true"></div>

  <!-- Pure Corridor: Only Artwork + Typewriter Year & Title -->
  <main class="corridor" id="corridor" aria-label="Modern Indian History Visual Timeline"></main>

  <div class="corridor-bar-track" aria-hidden="true">
    <div class="corridor-bar" id="corridor-bar"></div>
  </div>

  <script>
    const FALLBACK_TIMELINE = [
      {
        "id": "1757-plassey",
        "year": "1757",
        "chapter": "Company Ascendancy",
        "wing": "Wing I — Mercantile Conquest",
        "title": "Battle of Plassey on the Banks of the Bhagirathi",
        "aspect": "classic",
        "image": "assets/1757-plassey.jpg"
      },
      {
        "id": "1765-allahabad",
        "year": "1765",
        "chapter": "The Diwani Charter",
        "wing": "Wing I — Mercantile Conquest",
        "title": "Treaty of Allahabad & Grant of Diwani Rights",
        "aspect": "wide",
        "image": "assets/1765-allahabad.jpg"
      },
      {
        "id": "1855-santhal-hool",
        "year": "1855",
        "chapter": "Indigenous Uprisings",
        "wing": "Wing II — Subaltern & Great Revolt",
        "title": "Sidhu & Kanhu Murmu Leading the Santhal Hool",
        "aspect": "tall",
        "image": "assets/1855-santhal-hool.jpg"
      },
      {
        "id": "1857-kunwar-singh",
        "year": "1857",
        "chapter": "First War of Independence",
        "wing": "Wing II — Subaltern & Great Revolt",
        "title": "Babu Veer Kunwar Singh at Arrah & Jagdishpur",
        "aspect": "classic",
        "image": "assets/1857-kunwar-singh.jpg"
      },
      {
        "id": "1857-delhi-front",
        "year": "1857",
        "chapter": "First War of Independence",
        "wing": "Wing II — Subaltern & Great Revolt",
        "title": "The Delhi Front at Kashmiri Gate & Red Fort",
        "aspect": "wide",
        "image": "assets/1857-delhi-front.jpg"
      },
      {
        "id": "1905-swadeshi",
        "year": "1905",
        "chapter": "Swadeshi Awakening",
        "wing": "Wing III — Mass Nationalist Awakening",
        "title": "Swadeshi Looms & Dawn Gatherings on the Hooghly",
        "aspect": "classic",
        "image": "assets/1905-swadeshi.jpg"
      },
      {
        "id": "1930-dandi-march",
        "year": "1930",
        "chapter": "Civil Disobedience",
        "wing": "Wing III — Mass Nationalist Awakening",
        "title": "The Coastal Salt Satyagraha at Dandi",
        "aspect": "wide",
        "image": "assets/1930-dandi-march.jpg"
      },
      {
        "id": "1942-quit-india",
        "year": "1942",
        "chapter": "Quit India Uprising",
        "wing": "Wing IV — Final Surge to Sovereignty",
        "title": "The Seven Student Martyrs at Patna Secretariat",
        "aspect": "classic",
        "image": "assets/1942-quit-india.jpg"
      }
    ];

    function extractNumericYear(yearStr) {
      if (!yearStr) return 0;
      const match = String(yearStr).match(/(\d{3,4})/);
      return match ? parseInt(match[1], 10) : 0;
    }

    function formatYearStamp(yearStr) {
      const trimmed = String(yearStr || "").trim();
      if (!trimmed) return "A.D. —";
      if (/^(A\.?D\.?|B\.?C\.?)/i.test(trimmed)) return trimmed.toUpperCase();
      return "A.D. " + trimmed;
    }

    function buildFallbackSvg(item) {
      const yearText = formatYearStamp(item.year);
      const titleText = String(item.title || "").slice(0, 40);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
        <rect width="800" height="600" fill="#0c0b0e"/>
        <circle cx="400" cy="270" r="90" fill="none" stroke="#d6b26d" stroke-opacity="0.3" stroke-width="1.5"/>
        <text x="400" y="280" text-anchor="middle" fill="#d6b26d" font-family="Cinzel, Georgia, serif" font-size="34" letter-spacing="8">${yearText}</text>
        <text x="400" y="440" text-anchor="middle" fill="#ede6d6" fill-opacity="0.8" font-family="Georgia, serif" font-size="18">${titleText}</text>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    /* Typewriter Animation Engine per Exhibit */
    const activeTimers = new WeakMap();

    function playTypewriter(bay, yearText, titleText) {
      const yearEl = bay.querySelector(".year-stamp");
      const titleEl = bay.querySelector(".title-stamp");
      if (!yearEl || !titleEl) return;

      const prev = activeTimers.get(bay);
      if (prev) {
        clearTimeout(prev.t1);
        clearTimeout(prev.t2);
      }

      yearEl.textContent = "";
      titleEl.textContent = "";
      yearEl.classList.add("tw-cursor");
      titleEl.classList.remove("tw-cursor");

      let yIdx = 0;
      let tIdx = 0;
      const state = { t1: null, t2: null };
      activeTimers.set(bay, state);

      function stepYear() {
        if (yIdx < yearText.length) {
          yearEl.textContent += yearText.charAt(yIdx);
          yIdx++;
          state.t1 = setTimeout(stepYear, 32);
        } else {
          yearEl.classList.remove("tw-cursor");
          titleEl.classList.add("tw-cursor");
          state.t2 = setTimeout(stepTitle, 60);
        }
      }

      function stepTitle() {
        if (tIdx < titleText.length) {
          titleEl.textContent += titleText.charAt(tIdx);
          tIdx++;
          state.t2 = setTimeout(stepTitle, 22);
        } else {
          setTimeout(() => titleEl.classList.remove("tw-cursor"), 650);
        }
      }

      stepYear();
    }

    async function loadTimelineData() {
      try {
        const response = await fetch("data/timeline.json", { cache: "no-store" });
        if (response.ok) {
          const json = await response.json();
          if (Array.isArray(json) && json.length > 0) return json;
        }
      } catch (err) {}

      try {
        const cached = localStorage.getItem("virasat_timeline_cache");
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {}

      return FALLBACK_TIMELINE;
    }

    function renderCorridor(exhibits) {
      const corridor = document.getElementById("corridor");
      if (!corridor) return;

      const sorted = [...exhibits].sort(
        (a, b) => extractNumericYear(a.year) - extractNumericYear(b.year)
      );

      corridor.innerHTML = "";

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const bay = entry.target;
              if (!bay.dataset.typedOnce) {
                bay.dataset.typedOnce = "true";
                playTypewriter(bay, bay.dataset.yearText, bay.dataset.titleText);
              }
            }
          });
        },
        { root: corridor, threshold: 0.35 }
      );

      sorted.forEach((item, index) => {
        const bay = document.createElement("article");
        bay.className = "exhibit-item";
        bay.dataset.id = item.id || ("item-" + index);
        const formattedYear = formatYearStamp(item.year);
        const formattedTitle = item.title || "";
        bay.dataset.yearText = formattedYear;
        bay.dataset.titleText = formattedTitle;

        const aspectKey = ["wide", "tall", "classic"].includes(item.aspect)
          ? item.aspect
          : "classic";
        const canvasWrap = document.createElement("div");
        canvasWrap.className = `canvas-wrap aspect-${aspectKey}`;

        const resolvedSrc = item.image || buildFallbackSvg(item);

        const img = document.createElement("img");
        img.className = "canvas-image";
        img.src = resolvedSrc;
        img.alt = formattedTitle || "Historical Artwork";
        img.loading = "eager";
        img.decoding = "async";
        img.draggable = false;

        canvasWrap.appendChild(img);

        const labelBox = document.createElement("div");
        labelBox.className = "exhibit-label";

        const yearEl = document.createElement("span");
        yearEl.className = "year-stamp";

        const titleEl = document.createElement("h2");
        titleEl.className = "title-stamp";

        labelBox.appendChild(yearEl);
        labelBox.appendChild(titleEl);

        const reflection = document.createElement("div");
        reflection.className = "floor-reflection";
        reflection.setAttribute("aria-hidden", "true");

        const reflImg = document.createElement("img");
        reflImg.className = "reflection-img";
        reflImg.src = resolvedSrc;
        reflImg.alt = "";
        reflImg.draggable = false;

        img.addEventListener("error", function () {
          const fallback = buildFallbackSvg(item);
          if (img.src !== fallback) {
            img.src = fallback;
            reflImg.src = fallback;
          }
        });

        reflection.appendChild(reflImg);

        bay.appendChild(canvasWrap);
        bay.appendChild(labelBox);
        bay.appendChild(reflection);

        const activateFocus = () => {
          corridor.classList.add("cinema-active");
          corridor.querySelectorAll(".exhibit-item").forEach((b) => b.classList.remove("is-focused"));
          bay.classList.add("is-focused");
          playTypewriter(bay, formattedYear, formattedTitle);
        };

        const releaseFocus = () => {
          bay.classList.remove("is-focused");
          if (!corridor.querySelector(".exhibit-item.is-focused")) {
            corridor.classList.remove("cinema-active");
          }
        };

        bay.addEventListener("mouseenter", activateFocus);
        bay.addEventListener("mouseleave", releaseFocus);

        canvasWrap.addEventListener("click", () => {
          if (hasMovedDuringDrag) return;
          const bayCenter = bay.offsetLeft + bay.offsetWidth / 2;
          const target = bayCenter - corridor.clientWidth / 2;
          setTargetScroll(target);
        });

        corridor.appendChild(bay);
        observer.observe(bay);
      });

      updateProgress();
    }

    let targetScroll = 0;
    let currentScroll = 0;
    let rafId = null;
    let isDragging = false;
    let hasMovedDuringDrag = false;
    let dragStartX = 0;
    let dragScrollStart = 0;
    let lastDragX = 0;
    let dragVelocity = 0;

    function clamp(val, corridor) {
      const maxScroll = Math.max(0, corridor.scrollWidth - corridor.clientWidth);
      return Math.max(0, Math.min(maxScroll, val));
    }

    function updateProgress() {
      const corridor = document.getElementById("corridor");
      const bar = document.getElementById("corridor-bar");
      if (!corridor || !bar) return;
      const maxScroll = Math.max(1, corridor.scrollWidth - corridor.clientWidth);
      const pct = Math.min(100, Math.max(0, (corridor.scrollLeft / maxScroll) * 100));
      bar.style.width = pct.toFixed(2) + "%";
    }

    function stepScroll() {
      const corridor = document.getElementById("corridor");
      if (!corridor) return;
      const diff = targetScroll - currentScroll;
      if (Math.abs(diff) > 0.4) {
        currentScroll += diff * 0.14;
        corridor.scrollLeft = currentScroll;
        updateProgress();
        rafId = requestAnimationFrame(stepScroll);
      } else {
        currentScroll = targetScroll;
        corridor.scrollLeft = targetScroll;
        updateProgress();
        rafId = null;
      }
    }

    function setTargetScroll(nextScroll) {
      const corridor = document.getElementById("corridor");
      if (!corridor) return;
      if (!rafId) currentScroll = corridor.scrollLeft;
      targetScroll = clamp(nextScroll, corridor);
      if (!rafId) rafId = requestAnimationFrame(stepScroll);
    }

    function setupControls() {
      const corridor = document.getElementById("corridor");
      if (!corridor) return;

      window.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
          if (!rafId) {
            currentScroll = corridor.scrollLeft;
            targetScroll = corridor.scrollLeft;
          }
          setTargetScroll(targetScroll + delta * 1.35);
        },
        { passive: false }
      );

      corridor.addEventListener("mousedown", (e) => {
        isDragging = true;
        hasMovedDuringDrag = false;
        corridor.classList.add("is-dragging");
        dragStartX = e.pageX;
        lastDragX = e.pageX;
        dragVelocity = 0;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        dragScrollStart = corridor.scrollLeft;
        currentScroll = corridor.scrollLeft;
        targetScroll = corridor.scrollLeft;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = e.pageX - lastDragX;
        dragVelocity = dx;
        lastDragX = e.pageX;
        const total = dragStartX - e.pageX;
        if (Math.abs(total) > 4) hasMovedDuringDrag = true;
        corridor.scrollLeft = clamp(dragScrollStart + total * 1.2, corridor);
        currentScroll = corridor.scrollLeft;
        targetScroll = corridor.scrollLeft;
        updateProgress();
      });

      window.addEventListener("mouseup", () => {
        if (!isDragging) return;
        isDragging = false;
        corridor.classList.remove("is-dragging");
        if (Math.abs(dragVelocity) > 2) {
          setTargetScroll(corridor.scrollLeft - dragVelocity * 8);
        }
      });

      corridor.addEventListener(
        "touchstart",
        (e) => {
          if (!e.touches || e.touches.length === 0) return;
          isDragging = true;
          hasMovedDuringDrag = false;
          dragStartX = e.touches[0].pageX;
          lastDragX = dragStartX;
          dragVelocity = 0;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          dragScrollStart = corridor.scrollLeft;
          currentScroll = corridor.scrollLeft;
          targetScroll = corridor.scrollLeft;
        },
        { passive: true }
      );

      corridor.addEventListener(
        "touchmove",
        (e) => {
          if (!isDragging || !e.touches || e.touches.length === 0) return;
          const x = e.touches[0].pageX;
          dragVelocity = x - lastDragX;
          lastDragX = x;
          const total = dragStartX - x;
          if (Math.abs(total) > 4) hasMovedDuringDrag = true;
          corridor.scrollLeft = clamp(dragScrollStart + total * 1.15, corridor);
          currentScroll = corridor.scrollLeft;
          targetScroll = corridor.scrollLeft;
          updateProgress();
        },
        { passive: true }
      );

      corridor.addEventListener(
        "touchend",
        () => {
          if (!isDragging) return;
          isDragging = false;
          if (Math.abs(dragVelocity) > 2) {
            setTargetScroll(corridor.scrollLeft - dragVelocity * 7);
          }
        },
        { passive: true }
      );

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          e.preventDefault();
          setTargetScroll((rafId ? targetScroll : corridor.scrollLeft) + 420);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          setTargetScroll((rafId ? targetScroll : corridor.scrollLeft) - 420);
        }
      });

      corridor.addEventListener("scroll", () => {
        if (!rafId && !isDragging) {
          currentScroll = corridor.scrollLeft;
          targetScroll = corridor.scrollLeft;
        }
        updateProgress();
      });
    }

    window.addEventListener("DOMContentLoaded", async () => {
      setupControls();
      const exhibits = await loadTimelineData();
      renderCorridor(exhibits);
    });
  </script>
</body>
</html>
