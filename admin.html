<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curator Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background: #000000;
      color: #ede6d6;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Security Gate Modal (PIN: 7714) */
    .gate-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 45%, #0d0c10 0%, #000000 85%);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .gate-overlay.is-unlocked { opacity: 0; visibility: hidden; pointer-events: none; }
    .gate-card {
      width: 100%; max-width: 360px;
      background: #060608;
      border: 1px solid rgba(214, 178, 109, 0.25);
      border-radius: 4px; padding: 2.5rem 2rem;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 1.25rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
    }
    .gate-title {
      font-family: 'Cinzel', serif; font-size: 0.82rem;
      letter-spacing: 0.32em; text-transform: uppercase; color: #d6b26d;
    }
    .gate-sub { font-size: 0.76rem; color: rgba(237, 230, 214, 0.5); margin-top: -0.5rem; }
    .gate-pin-input {
      width: 100%; background: #0b0b0e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px; color: #ffffff;
      font-size: 1.4rem; font-family: monospace; letter-spacing: 0.45em;
      text-align: center; padding: 0.75rem 1rem; outline: none;
      transition: border-color 0.2s ease;
    }
    .gate-pin-input:focus { border-color: #d6b26d; }
    .gate-btn {
      width: 100%; background: #d6b26d; color: #000000;
      border: none; padding: 0.8rem;
      font-family: 'Cinzel', serif; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; transition: background 0.2s ease;
    }
    .gate-btn:hover { background: #ebd297; }
    .gate-error { font-size: 0.72rem; color: #e06c62; min-height: 1.1rem; }

    /* Admin Viewport */
    .admin-viewport {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 500px 1fr;
      background: #000000;
    }
    @media (max-width: 980px) { .admin-viewport { grid-template-columns: 1fr; } }

    .admin-form-pane {
      background: #050507;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: clamp(1.5rem, 2.8vw, 2.2rem);
      display: flex; flex-direction: column; justify-content: space-between;
      gap: 1.15rem; max-height: 100vh; overflow-y: auto;
    }
    .form-header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding-bottom: 0.85rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .form-title {
      font-family: 'Cinzel', serif; font-size: 0.88rem; font-weight: 600;
      letter-spacing: 0.28em; text-transform: uppercase; color: #d6b26d;
    }
    .target-badge { font-family: monospace; font-size: 0.68rem; color: rgba(255, 255, 255, 0.38); }
    .form-body { display: flex; flex-direction: column; gap: 0.85rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.32rem; }
    .field-label {
      font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(237, 230, 214, 0.55);
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.65rem; }

    .minimal-input, .minimal-select {
      width: 100%; background: #0a0a0d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ede6d6; font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem; padding: 0.6rem 0.78rem; border-radius: 2px;
      transition: border-color 0.2s ease;
    }
    .minimal-input:focus, .minimal-select:focus { outline: none; border-color: #d6b26d; }

    .input-toggle-wrap { position: relative; display: flex; align-items: center; }
    .toggle-pat-btn {
      position: absolute; right: 6px; background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d6b26d; font-size: 0.62rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.22rem 0.45rem;
      cursor: pointer; border-radius: 2px;
    }
    .toggle-pat-btn:hover { background: rgba(214, 178, 109, 0.12); }

    /* Direct File Upload Box & Prominent Upload Button */
    .upload-card {
      border: 1px dashed rgba(214, 178, 109, 0.45);
      border-radius: 3px;
      padding: 0.95rem;
      background: rgba(214, 178, 109, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      text-align: center;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .upload-card.is-dragover {
      border-color: #d6b26d;
      background: rgba(214, 178, 109, 0.1);
    }

    .btn-direct-upload {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #141318;
      border: 1px solid #d6b26d;
      color: #f0d79a;
      padding: 0.65rem 1rem;
      font-family: 'Cinzel', serif;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-direct-upload:hover {
      background: #d6b26d;
      color: #000000;
    }

    .upload-hint {
      font-size: 0.67rem;
      color: rgba(237, 230, 214, 0.48);
    }

    .file-input-native {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .file-selected-badge {
      display: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.69rem;
      color: #b8f0d0;
      background: rgba(76, 169, 119, 0.12);
      border: 1px solid rgba(76, 169, 119, 0.35);
      padding: 0.35rem 0.6rem;
      border-radius: 2px;
      width: 100%;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-ai-inspect {
      width: 100%;
      background: linear-gradient(135deg, rgba(214, 178, 109, 0.16) 0%, rgba(184, 93, 59, 0.22) 100%);
      border: 1px solid rgba(214, 178, 109, 0.4);
      color: #f0d79a;
      font-size: 0.71rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.55rem 0.85rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ai-inspect:hover:not(:disabled) {
      background: rgba(214, 178, 109, 0.32);
      border-color: #d6b26d;
      color: #ffffff;
    }
    .btn-ai-inspect:disabled { opacity: 0.45; cursor: not-allowed; }

    .action-group { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.25rem; }
    .btn-commit {
      width: 100%; background: #d6b26d; color: #000000; border: none;
      padding: 0.76rem 1rem; font-family: 'Cinzel', serif; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; border-radius: 2px;
      transition: all 0.2s ease;
    }
    .btn-commit:hover:not(:disabled) { background: #ebd297; }
    .btn-commit:disabled { opacity: 0.4; cursor: not-allowed; }

    .secondary-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .btn-sec {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(237, 230, 214, 0.75); font-size: 0.69rem; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 0.52rem; cursor: pointer; border-radius: 2px;
      transition: all 0.18s ease;
    }
    .btn-sec:hover:not(:disabled) { border-color: #d6b26d; color: #d6b26d; }

    .status-line {
      font-size: 0.72rem; line-height: 1.4; color: rgba(237, 230, 214, 0.5);
      padding-top: 0.45rem; border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .status-line.is-success { color: #6ed097; }
    .status-line.is-error { color: #e06c62; }

    /* Right Live Preview Stage */
    .admin-stage-pane {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: clamp(2rem, 5vw, 4rem);
      background: radial-gradient(circle at 50% 50%, #08080b 0%, #000000 90%);
      position: relative; overflow: hidden;
    }
    .preview-canvas-wrap {
      position: relative; height: clamp(260px, 52vh, 480px);
      aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden;
      background: #09090c;
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 1), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: aspect-ratio 0.3s ease, height 0.3s ease;
    }
    .preview-canvas-wrap.aspect-wide { aspect-ratio: 16 / 10; }
    .preview-canvas-wrap.aspect-tall { aspect-ratio: 3 / 4; height: clamp(280px, 56vh, 520px); }
    .preview-canvas-wrap.aspect-classic { aspect-ratio: 4 / 3; }

    .wireframe-fallback {
      position: absolute; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(214, 178, 109, 0.08) 0%, #070709 85%),
                  repeating-linear-gradient(45deg, rgba(214, 178, 109, 0.02) 0px, rgba(214, 178, 109, 0.02) 1px, transparent 1px, transparent 12px);
    }
    .wireframe-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .wireframe-label {
      position: relative; z-index: 2; font-family: 'Cinzel', serif; font-size: 0.68rem;
      letter-spacing: 0.28em; text-transform: uppercase; color: #d6b26d; opacity: 0.85;
      padding: 6px 14px; border: 1px solid rgba(214, 178, 109, 0.25); background: rgba(0, 0, 0, 0.6);
    }
    #preview-image-el {
      position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover;
      display: block; opacity: 0; transition: opacity 0.25s ease;
    }
    #preview-image-el.is-loaded { opacity: 1; }

    .preview-label-box {
      margin-top: 22px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      max-width: clamp(280px, 36vw, 460px);
    }
    .preview-year-stamp {
      font-family: 'JetBrains Mono', 'Cinzel', monospace; font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.32em; text-transform: uppercase; color: #d6b26d;
    }
    .preview-title-stamp {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1rem, 1.35vw, 1.25rem); font-weight: 500;
      line-height: 1.35; letter-spacing: 0.01em; color: #ede6d6;
    }
  </style>
</head>
<body>
  <!-- PIN Security Gate (Password: 7714) -->
  <div class="gate-overlay" id="gate-overlay">
    <div class="gate-card">
      <h1 class="gate-title">Curator Security Access</h1>
      <p class="gate-sub">Enter Access PIN to Unlock Studio</p>
      <input type="password" id="gate-pin" class="gate-pin-input" maxlength="4" placeholder="••••" autocomplete="off" autofocus />
      <button type="button" id="gate-submit-btn" class="gate-btn">Authorize</button>
      <span class="gate-error" id="gate-error-msg"></span>
    </div>
  </div>

  <div class="admin-viewport">
    <aside class="admin-form-pane">
      <div class="form-header">
        <span class="form-title">Curator Studio</span>
        <span class="target-badge">PIN: 7714 &middot; timeline.json</span>
      </div>

      <form id="curator-form" class="form-body" novalidate>
        <!-- GitHub Repo & Branch -->
        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="github-repo">Repository</label>
            <input class="minimal-input" type="text" id="github-repo" placeholder="owner/repo" required />
          </div>
          <div class="field-group">
            <label class="field-label" for="github-branch">Branch</label>
            <input class="minimal-input" type="text" id="github-branch" value="main" placeholder="main" />
          </div>
        </div>

        <!-- Personal Access Token -->
        <div class="field-group">
          <label class="field-label" for="github-pat">Personal Access Token (PAT)</label>
          <div class="input-toggle-wrap">
            <input class="minimal-input" type="password" id="github-pat" placeholder="ghp_... (write scope)" style="padding-right: 4rem;" required />
            <button type="button" class="toggle-pat-btn" id="toggle-pat-btn">Show</button>
          </div>
        </div>

        <!-- Optional Gemini API Key -->
        <div class="field-group">
          <label class="field-label" for="gemini-api-key">
            <span>Gemini API Key</span>
            <span style="opacity: 0.5;">Auto-Inspect Vision</span>
          </label>
          <div class="input-toggle-wrap">
            <input class="minimal-input" type="password" id="gemini-api-key" placeholder="AIzaSy... (For 1-click vision metadata)" style="padding-right: 4rem;" />
            <button type="button" class="toggle-pat-btn" id="toggle-gemini-btn">Show</button>
          </div>
        </div>

        <!-- PROMINENT DIRECT PHOTO FILE UPLOAD + DRAG & DROP -->
        <div class="field-group">
          <label class="field-label">
            <span>1. Upload Exhibit Photo</span>
            <span style="opacity: 0.5;">Device File or Drag &amp; Drop</span>
          </label>

          <div class="upload-card" id="drop-zone">
            <input type="file" id="photo-file-input" class="file-input-native" accept="image/*" />
            <label for="photo-file-input" class="btn-direct-upload">
              <span>⇪</span>
              <span>Upload Photo from Device</span>
            </label>
            <span class="upload-hint">Or drag &amp; drop JPG, PNG, WEBP here &middot; Auto-saves to <code>assets/</code></span>
            <div class="file-selected-badge" id="file-badge"></div>
          </div>

          <input class="minimal-input" type="text" id="exhibit-image" value="assets/1857-kunwar-singh.jpg" placeholder="Or paste image path / direct https:// URL" required />

          <button type="button" class="btn-ai-inspect" id="btn-ai-inspect">
            <span>✦</span>
            <span>Gemini AI Auto-Fill Year &amp; Title from Photo</span>
          </button>
        </div>

        <!-- Exhibit Metadata -->
        <div class="field-row-3">
          <div class="field-group">
            <label class="field-label" for="exhibit-year">Year</label>
            <input class="minimal-input" type="text" id="exhibit-year" value="1857" placeholder="1857" required />
          </div>
          <div class="field-group">
            <label class="field-label" for="exhibit-aspect">Aspect</label>
            <select class="minimal-select" id="exhibit-aspect">
              <option value="classic" selected>classic (4:3)</option>
              <option value="wide">wide (16:10)</option>
              <option value="tall">tall (3:4)</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="exhibit-chapter">Chapter</label>
            <input class="minimal-input" type="text" id="exhibit-chapter" value="Great Revolt" placeholder="Chapter" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="exhibit-title">Visual Title</label>
          <input class="minimal-input" type="text" id="exhibit-title" value="Babu Veer Kunwar Singh at Arrah &amp; Jagdishpur" placeholder="Visual Title" required />
        </div>

        <!-- Action Buttons -->
        <div class="action-group">
          <button type="submit" class="btn-commit" id="commit-exhibit-btn">Commit Photo &amp; JSON to GitHub</button>
          <div class="secondary-btn-row">
            <button type="button" class="btn-sec" id="fetch-repo-btn">Fetch Repo</button>
            <button type="button" class="btn-sec" id="download-json-btn">Export JSON</button>
          </div>
        </div>
      </form>

      <div class="status-line" id="status-banner" role="status">
        Ready. Upload a photo from your device or paste a URL.
      </div>
    </aside>

    <!-- Live Preview Stage -->
    <main class="admin-stage-pane" aria-label="Live Preview Stage">
      <div class="preview-canvas-wrap aspect-classic" id="preview-canvas-box">
        <div class="wireframe-fallback" id="preview-wireframe">
          <svg class="wireframe-svg" viewBox="0 0 400 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="lum" cx="50%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#3a2818" stop-opacity="0.3" />
                <stop offset="100%" stop-color="#000000" stop-opacity="0" />
              </radialGradient>
            </defs>
            <rect width="400" height="300" fill="url(#lum)" />
            <rect x="18" y="18" width="364" height="264" fill="none" stroke="#d6b26d" stroke-opacity="0.3" stroke-width="1.2" />
            <circle cx="200" cy="150" r="54" fill="none" stroke="#d6b26d" stroke-opacity="0.3" stroke-width="1.2" />
          </svg>
          <span class="wireframe-label" id="wireframe-label">Awaiting Photo</span>
        </div>
        <img id="preview-image-el" alt="Live Preview" src="" />
      </div>

      <div class="preview-label-box">
        <span class="preview-year-stamp" id="preview-year-stamp">A.D. 1857</span>
        <h2 class="preview-title-stamp" id="preview-title-stamp">Babu Veer Kunwar Singh at Arrah &amp; Jagdishpur</h2>
      </div>
    </main>
  </div>

  <script>
    const REQUIRED_PIN = "7714";

    let uploadedFileBase64 = null;
    let uploadedFileName = "";
    let uploadedFileMime = "";

    function parseYear(str) {
      const match = String(str || "").match(/(\d{3,4})/);
      return match ? parseInt(match[1], 10) : 0;
    }

    function formatYear(str) {
      const t = String(str || "").trim();
      if (!t) return "A.D. —";
      if (/^(A\.?D\.?|B\.?C\.?)/i.test(t)) return t.toUpperCase();
      return "A.D. " + t;
    }

    function generateId(yr, title) {
      const y = parseYear(yr) || "0000";
      const s = String(title || "exhibit").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24);
      return `${y}-${s || "item"}`;
    }

    function encodeBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function decodeBase64(b64) {
      const bin = atob(String(b64).replace(/\s+/g, ""));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function setStatus(msg, type = "info") {
      const b = document.getElementById("status-banner");
      if (!b) return;
      b.className = "status-line";
      if (type === "success") b.classList.add("is-success");
      if (type === "error") b.classList.add("is-error");
      b.textContent = msg;
    }

    function updatePreview() {
      const yrVal = document.getElementById("exhibit-year").value;
      const titleVal = document.getElementById("exhibit-title").value;
      const imgVal = document.getElementById("exhibit-image").value.trim();
      const aspectVal = document.getElementById("exhibit-aspect").value || "classic";

      document.getElementById("preview-year-stamp").textContent = formatYear(yrVal);
      document.getElementById("preview-title-stamp").textContent = titleVal || "Untitled Exhibit";

      const canvasBox = document.getElementById("preview-canvas-box");
      canvasBox.className = `preview-canvas-wrap aspect-${aspectVal}`;

      const previewImg = document.getElementById("preview-image-el");
      const wireframeLabel = document.getElementById("wireframe-label");

      if (uploadedFileBase64) {
        previewImg.classList.remove("is-loaded");
        wireframeLabel.textContent = "Loading File...";
        previewImg.onload = () => previewImg.classList.add("is-loaded");
        previewImg.src = uploadedFileBase64;
        return;
      }

      if (!imgVal) {
        previewImg.classList.remove("is-loaded");
        previewImg.removeAttribute("src");
        wireframeLabel.textContent = "Awaiting Photo";
        return;
      }

      previewImg.classList.remove("is-loaded");
      wireframeLabel.textContent = "Loading Canvas...";
      previewImg.onload = () => previewImg.classList.add("is-loaded");
      previewImg.onerror = () => {
        previewImg.classList.remove("is-loaded");
        wireframeLabel.textContent = "Upload Photo to Preview";
      };
      previewImg.src = imgVal;
    }

    /* Direct File Upload Handler */
    function handleSelectedFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please choose a valid image file (JPG, PNG, WEBP, SVG).", "error");
        return;
      }

      uploadedFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      uploadedFileMime = file.type || "image/jpeg";

      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedFileBase64 = e.target.result;
        const assetPath = `assets/${uploadedFileName}`;
        document.getElementById("exhibit-image").value = assetPath;

        // Auto-detect image aspect ratio (wide / tall / classic)
        const probe = new Image();
        probe.onload = () => {
          const ratio = probe.width / probe.height;
          if (ratio >= 1.45) {
            document.getElementById("exhibit-aspect").value = "wide";
          } else if (ratio <= 0.85) {
            document.getElementById("exhibit-aspect").value = "tall";
          } else {
            document.getElementById("exhibit-aspect").value = "classic";
          }
          updatePreview();
        };
        probe.src = uploadedFileBase64;

        const badge = document.getElementById("file-badge");
        badge.style.display = "block";
        badge.textContent = `✓ Selected: ${uploadedFileName} (${(file.size / 1024).toFixed(1)} KB) → ${assetPath}`;

        updatePreview();
        setStatus(`Photo ready: ${uploadedFileName}. Click 'Gemini AI Auto-Fill' or 'Commit Photo & JSON'.`, "success");
      };
      reader.readAsDataURL(file);
    }

    async function inspectWithGemini() {
      const apiKey = document.getElementById("gemini-api-key").value.trim();
      const imgUrl = document.getElementById("exhibit-image").value.trim();
      const aiBtn = document.getElementById("btn-ai-inspect");

      if (!apiKey) {
        setStatus("Paste your Gemini API Key first.", "error");
        document.getElementById("gemini-api-key").focus();
        return;
      }

      if (!uploadedFileBase64 && !imgUrl) {
        setStatus("Upload a photo from your device first.", "error");
        return;
      }

      aiBtn.disabled = true;
      setStatus("Analyzing uploaded photo with Gemini Vision AI...", "info");

      try {
        const parts = [];
        if (uploadedFileBase64 && uploadedFileBase64.includes(",")) {
          parts.push({
            inlineData: {
              mimeType: uploadedFileMime,
              data: uploadedFileBase64.split(",")[1]
            }
          });
        }
        parts.push({
          text: `You are a museum curator for Modern Indian History. Analyze this historical artwork/photograph (filename: "${uploadedFileName || imgUrl}").
Return ONLY a valid JSON object without markdown fences, with these exact keys:
"year": a 4-digit historical year (e.g. "1857"),
"title": a dignified, concise glance-recall title under 8 words (e.g. "Babu Veer Kunwar Singh at Arrah"),
"chapter": historical era/chapter (e.g. "Great Revolt"),
"aspect": "classic" or "wide" or "tall"`
        });

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts }] })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Gemini API returned ${res.status}`);
        }

        const data = await res.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        if (parsed.year) document.getElementById("exhibit-year").value = parsed.year;
        if (parsed.title) document.getElementById("exhibit-title").value = parsed.title;
        if (parsed.chapter) document.getElementById("exhibit-chapter").value = parsed.chapter;
        if (parsed.aspect && ["classic", "wide", "tall"].includes(parsed.aspect)) {
          document.getElementById("exhibit-aspect").value = parsed.aspect;
        }

        updatePreview();
        setStatus(`Gemini AI auto-filled: ${parsed.year} — "${parsed.title}"`, "success");
      } catch (err) {
        setStatus(`Gemini AI failed: ${err.message}`, "error");
      } finally {
        aiBtn.disabled = false;
      }
    }

    async function fetchRemote(repo, branch, pat) {
      const cleanRepo = repo.trim().replace(/^\/+|\/+$/g, "");
      if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(cleanRepo)) {
        throw new Error("Repository must follow 'owner/repo'");
      }
      const b = branch.trim() || "main";
      const url = `https://api.github.com/repos/${cleanRepo}/contents/data/timeline.json?ref=${encodeURIComponent(b)}`;
      const headers = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
      if (pat.trim()) headers["Authorization"] = `Bearer ${pat.trim()}`;

      const res = await fetch(url, { headers });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(`GitHub GET failed (${res.status}): ${body.message || res.statusText}`);
      }
      const data = await res.json();
      const list = JSON.parse(decodeBase64(data.content || ""));
      return { sha: data.sha, exhibits: list, cleanRepo, branch: b };
    }

    async function uploadImageToGitHub(cleanRepo, branch, pat, assetPath, base64Data) {
      const cleanPath = assetPath.replace(/^\/+/, "");
      const putUrl = `https://api.github.com/repos/${cleanRepo}/contents/${cleanPath}`;
      const rawBase64 = base64Data.includes(",") ? base64Data.split(",")[1] : base64Data;
      
      let existingSha = null;
      try {
        const checkRes = await fetch(`${putUrl}?ref=${encodeURIComponent(branch)}`, {
          headers: {
            "Authorization": `Bearer ${pat.trim()}`,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
          }
        });
        if (checkRes.ok) {
          const checkData = await checkRes.json();
          existingSha = checkData.sha;
        }
      } catch (e) {}

      const bodyPayload = {
        message: `Upload exhibit photo ${cleanPath}`,
        content: rawBase64,
        branch: branch
      };
      if (existingSha) bodyPayload.sha = existingSha;

      const uploadRes = await fetch(putUrl, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${pat.trim()}`,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(bodyPayload)
      });

      if (!uploadRes.ok) {
        const errBody = await uploadRes.json().catch(() => ({}));
        throw new Error(`Photo upload failed: ${errBody.message || uploadRes.statusText}`);
      }
    }

    async function handleCommit(e) {
      e.preventDefault();

      const repo = document.getElementById("github-repo").value;
      const branch = document.getElementById("github-branch").value;
      const pat = document.getElementById("github-pat").value;
      const yr = document.getElementById("exhibit-year").value.trim();
      const title = document.getElementById("exhibit-title").value.trim();
      const img = document.getElementById("exhibit-image").value.trim();
      const chapter = document.getElementById("exhibit-chapter").value.trim();
      const aspect = document.getElementById("exhibit-aspect").value || "classic";
      const btn = document.getElementById("commit-exhibit-btn");

      if (!yr || !title || !img) {
        setStatus("Please fill Year, Title, and upload a Photo.", "error");
        return;
      }

      const item = {
        id: generateId(yr, title),
        year: String(parseYear(yr) || yr),
        chapter: chapter || "Chronological Exhibit",
        wing: "Modern Indian History",
        title: title,
        aspect: aspect,
        image: img
      };

      if (repo.trim() && pat.trim()) {
        btn.disabled = true;
        try {
          const cleanRepo = repo.trim().replace(/^\/+|\/+$/g, "");
          const b = branch.trim() || "main";

          if (uploadedFileBase64 && img.startsWith("assets/")) {
            setStatus(`1/3 Uploading photo file to ${img}...`, "info");
            await uploadImageToGitHub(cleanRepo, b, pat, img, uploadedFileBase64);
          }

          setStatus("2/3 Fetching timeline.json from repo...", "info");
          const { sha, exhibits } = await fetchRemote(repo, branch, pat);
          const filtered = exhibits.filter((x) => x.id !== item.id);
          filtered.push(item);
          filtered.sort((a, b) => parseYear(a.year) - parseYear(b.year));

          setStatus("3/3 Committing updated timeline.json...", "info");
          const putUrl = `https://api.github.com/repos/${cleanRepo}/contents/data/timeline.json`;
          const putRes = await fetch(putUrl, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${pat.trim()}`,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: `Add ${item.year}: ${item.title}`,
              content: encodeBase64(JSON.stringify(filtered, null, 2) + "\n"),
              sha: sha,
              branch: b
            })
          });

          if (!putRes.ok) {
            const body = await putRes.json().catch(() => ({}));
            throw new Error(`GitHub PUT failed: ${body.message || putRes.statusText}`);
          }

          setStatus(`Committed "${item.year} — ${item.title}" & photo to ${cleanRepo}@${b}`, "success");
        } catch (err) {
          setStatus(err.message, "error");
        } finally {
          btn.disabled = false;
        }
        return;
      }

      setStatus("Enter your GitHub Repository and Personal Access Token (PAT) to push.", "error");
    }

    function checkPinAuthorization() {
      const pinInput = document.getElementById("gate-pin");
      const errorMsg = document.getElementById("gate-error-msg");
      const overlay = document.getElementById("gate-overlay");

      if (pinInput.value === REQUIRED_PIN) {
        overlay.classList.add("is-unlocked");
        try { sessionStorage.setItem("curator_gate_pass", "granted"); } catch (e) {}
        setStatus("Access authorized (PIN: 7714).", "success");
      } else {
        errorMsg.textContent = "Invalid PIN. Access restricted.";
        pinInput.value = "";
        pinInput.focus();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        if (sessionStorage.getItem("curator_gate_pass") === "granted") {
          document.getElementById("gate-overlay").classList.add("is-unlocked");
        }
      } catch (e) {}

      document.getElementById("gate-submit-btn").addEventListener("click", checkPinAuthorization);
      document.getElementById("gate-pin").addEventListener("keydown", (e) => {
        if (e.key === "Enter") checkPinAuthorization();
      });

      updatePreview();

      ["exhibit-year", "exhibit-title", "exhibit-image", "exhibit-chapter", "exhibit-aspect"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener("input", () => {
          if (id === "exhibit-image") {
            uploadedFileBase64 = null;
            document.getElementById("file-badge").style.display = "none";
          }
          updatePreview();
        });
        el.addEventListener("change", updatePreview);
      });

      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("photo-file-input");

      fileInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          handleSelectedFile(e.target.files[0]);
        }
      });

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("is-dragover");
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("is-dragover");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("is-dragover");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleSelectedFile(e.dataTransfer.files[0]);
        }
      });

      document.getElementById("btn-ai-inspect").addEventListener("click", inspectWithGemini);

      document.getElementById("toggle-pat-btn").addEventListener("click", () => {
        const input = document.getElementById("github-pat");
        const btn = document.getElementById("toggle-pat-btn");
        if (input.type === "password") { input.type = "text"; btn.textContent = "Hide"; }
        else { input.type = "password"; btn.textContent = "Show"; }
      });

      document.getElementById("toggle-gemini-btn").addEventListener("click", () => {
        const input = document.getElementById("gemini-api-key");
        const btn = document.getElementById("toggle-gemini-btn");
        if (input.type === "password") { input.type = "text"; btn.textContent = "Hide"; }
        else { input.type = "password"; btn.textContent = "Show"; }
      });

      document.getElementById("curator-form").addEventListener("submit", handleCommit);

      document.getElementById("fetch-repo-btn").addEventListener("click", async () => {
        const repo = document.getElementById("github-repo").value;
        const branch = document.getElementById("github-branch").value;
        const pat = document.getElementById("github-pat").value;
        if (!repo.trim()) { setStatus("Enter repository ('owner/repo')", "error"); return; }
        setStatus("Fetching timeline.json from GitHub...", "info");
        try {
          const { exhibits, cleanRepo, branch: b } = await fetchRemote(repo, branch, pat);
          setStatus(`Loaded ${exhibits.length} items from ${cleanRepo}@${b}`, "success");
        } catch (err) { setStatus(err.message, "error"); }
      });

      document.getElementById("download-json-btn").addEventListener("click", async () => {
        const repo = document.getElementById("github-repo").value;
        const branch = document.getElementById("github-branch").value;
        const pat = document.getElementById("github-pat").value;
        let list = [];
        if (repo.trim()) {
          try {
            const data = await fetchRemote(repo, branch, pat);
            list = data.exhibits;
          } catch (e) {}
        }
        const blob = new Blob([JSON.stringify(list, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "timeline.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus("Exported timeline.json", "success");
      });
    });
  </script>
